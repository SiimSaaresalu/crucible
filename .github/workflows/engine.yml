name: engine

on:
  pull_request:
    paths:
      - "engine/**"
      - "configs/**"
      - ".github/workflows/engine.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "configs/**"
      - ".github/workflows/engine.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: engine
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run nightshift eval --task incident@1 --policy reference,do_nothing,stop_early,shotgun --seeds 0-1 --concurrency 4 --out runs/ci

  docker:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: engine
      - run: uv sync --locked
      - run: scripts/docker_smoke.sh
        env:
          NIGHTSHIFT_GIT_COMMIT: ${{ github.sha }}
